name: FTE3600

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora 43 native build and software tests
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y git gcc gcc-c++ make meson ninja-build python3
          python3-gobject dbus-daemon
          pkgconf-pkg-config glib2-devel libgusb-devel libgudev-devel
          systemd systemd-devel cairo-devel umockdev umockdev-devel
      - uses: actions/checkout@v6
      - name: Check production and separate synthetic API builds
        run: ./scripts/check-fte3600.sh
      - name: Run toolkit unit and protocol-level D-Bus E2E tests
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s toolkit/tests -p 'test_core_unit.py' -v
          dbus-run-session -- python3 -W error::ResourceWarning -m unittest toolkit/tests/test_dbus_e2e.py -v

  ubuntu:
    name: Ubuntu 26.04 native build and software tests
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git meson ninja-build pkg-config python3 \
            python3-gi dbus \
            libglib2.0-dev libgusb-dev libgudev-1.0-dev \
            libudev-dev systemd systemd-dev libcairo2-dev \
            umockdev libumockdev-dev linux-headers-generic
      - uses: actions/checkout@v6
      - name: Build ACPI reset and IRQ glue
        run: |
          kernel_headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$kernel_headers"
          make -C kernel/fte3600 KDIR="$kernel_headers" W=1
      - name: Check production and separate synthetic API builds
        run: ./scripts/check-fte3600.sh
      - name: Run toolkit unit and protocol-level D-Bus E2E tests
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s toolkit/tests -p 'test_core_unit.py' -v
          dbus-run-session -- python3 -W error::ResourceWarning -m unittest toolkit/tests/test_dbus_e2e.py -v

  arch-package:
    name: Arch Linux makepkg build, tests, and package layout
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      - name: Install build, check, and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git sudo glib2 libgudev libgusb openssl pixman dkms \
            python python-gobject cairo glib2-devel gobject-introspection \
            meson ninja python-build python-installer python-setuptools \
            umockdev dbus desktop-file-utils
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify .SRCINFO and build package with makepkg
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          git config --system --add safe.directory '*'
          chmod a+rx "$GITHUB_WORKSPACE"

          rm -rf /tmp/arch-pkg
          cp -a "$GITHUB_WORKSPACE/packaging/arch" /tmp/arch-pkg
          chown -R builder:builder /tmp/arch-pkg

          su - builder -c 'cd /tmp/arch-pkg && makepkg --printsrcinfo' > /tmp/generated.SRCINFO
          diff -u "$GITHUB_WORKSPACE/packaging/arch/.SRCINFO" /tmp/generated.SRCINFO

          head_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          python3 - "$GITHUB_WORKSPACE" "$head_sha" <<'PY'
          import pathlib, re, sys
          workspace, head_sha = sys.argv[1], sys.argv[2]
          pkgbuild = pathlib.Path("/tmp/arch-pkg/PKGBUILD")
          text = pkgbuild.read_text(encoding="utf-8")
          new_text, count = re.subn(
              r'^source=\(.*\)$',
              f'source=("libfprint::git+file://{workspace}#commit={head_sha}")',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected 1 source=() line in PKGBUILD, replaced {count}")
          pkgbuild.write_text(new_text, encoding="utf-8")
          PY
          chown -R builder:builder /tmp/arch-pkg

          su - builder -c 'cd /tmp/arch-pkg && makepkg --noconfirm'

          pkg_file=$(find /tmp/arch-pkg -maxdepth 1 -name 'libfprint-fte3600-git-*.pkg.tar.zst' ! -name '*-debug-*' | head -n 1)
          test -n "$pkg_file"
          bsdtar -tf "$pkg_file" > /tmp/pkg-files.txt
          for required in \
            'usr/lib/libfprint-2.so' \
            'usr/bin/fte3600-toolkit' \
            'usr/bin/fte3600-toolkit-gui' \
            'usr/bin/fte3600-tool' \
            'usr/share/applications/org.freedesktop.libfprint.Fte3600Toolkit.desktop' \
            'usr/src/fte3600-0.2/dkms.conf'; do
            grep -qx "$required" /tmp/pkg-files.txt || {
              echo "Missing expected package file: $required" >&2
              cat /tmp/pkg-files.txt >&2
              exit 1
            }
          done
