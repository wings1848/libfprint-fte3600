[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fte3600-toolkit"
version = "0.1.0"
description = "Unprivileged enrollment, recognition feedback, and diagnostics toolkit for FTE3600 / GPD fingerprint readers over fprintd D-Bus."
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
requires-python = ">=3.11"
authors = [
  { name = "FTE3600 Linux contributors" },
]
keywords = ["fingerprint", "libfprint", "fprintd", "fte3600", "gpd", "gtk4", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Runtime relies on system PyGObject (python-gobject / python3-gi) + GTK4/libadwaita for GUI.
dependencies = []

[project.scripts]
fte3600-toolkit = "fte3600_toolkit.cli.main:entrypoint"
fte3600-toolkit-gui = "fte3600_toolkit.gui.app:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
